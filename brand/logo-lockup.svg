<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 32" width="208" height="32" role="img" aria-label="Nullstamp">
  <title>Nullstamp</title>
  <!--
    Susunan mendatar: tanda, jarak satu modul, lalu nama.
    Nama ditulis satu warna saja. Aksen hanya hidup di palang diagonal supaya
    mata punya satu titik jatuh, bukan dua.
  -->
  <defs>
    <mask id="ns-cut-lockup">
      <rect width="32" height="32" fill="#fff"/>
      <line x1="7" y1="25" x2="25" y2="7" stroke="#000" stroke-width="7.6" stroke-linecap="round"/>
    </mask>
  </defs>
  <circle cx="16" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="3.25" mask="url(#ns-cut-lockup)"/>
  <line x1="7.6" y1="24.4" x2="24.4" y2="7.6" stroke="#D6452C" stroke-width="3.25" stroke-linecap="round"/>
  <text x="44" y="22.4"
        font-family="'Inter Tight','Inter','Helvetica Neue',Arial,sans-serif"
        font-size="21" font-weight="600" letter-spacing="-0.7"
        fill="currentColor">nullstamp</text>
</svg>
